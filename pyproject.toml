[project]
name = "narrative-radar"
version = "0.2.0"
description = "Personal Intelligence Graph: 커뮤니티에서 관측된 내러티브의 시간적 변화를 근거와 함께 보여주는 웹앱"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20",
    "apscheduler>=3.11,<4",
    "fastapi>=0.143",
    "httpx>=0.28",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "typer>=0.27",
    "uvicorn[standard]>=0.54",
    "websockets>=15",
]

[project.scripts]
nr = "narrative_radar.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/narrative_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DTZ"]

[tool.ruff.lint.flake8-bugbear]
# typer는 기본값 자리에서 Option/Argument를 부르는 방식이 표준이다
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]
